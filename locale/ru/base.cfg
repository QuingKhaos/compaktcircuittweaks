[mod-setting-name]
compaktcircuittweaks-recipe-tech-overhaul=Убрать [item=advanced-circuit] и [item=processing-unit] из рецептов компактных процессоров

[mod-setting-description]
compaktcircuittweaks-recipe-tech-overhaul=Если включено, для рецептов компактных процессоров больше не требуются [предмет=advanced-circuit] и [предмет=processing-unit]. Вместо этого потребуется больше базовых компонентов, что упростит их производство в начале игры.\n\nЭто изменение также позволит переместить технологию компактных схем непосредственно после сетевых схем в технологическом древе и удешевит исследования.


